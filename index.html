<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch Hub</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 20px 0;
      background: linear-gradient(135deg, #7c9cff, #36d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: #a5b4d3;
      margin: 0 0 40px 0;
      font-size: 1.1rem;
    }

    button {
      padding: 22px 60px;
      border: none;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      background: linear-gradient(135deg, #7c9cff, #36d399);
      color: #08111d;
      box-shadow: 0 18px 42px rgba(124, 156, 255, 0.45);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 24px 60px rgba(124, 156, 255, 0.65);
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      margin-top: 20px;
      color: #7c9cff;
      font-weight: 700;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(124, 156, 255, 0.3);
      border-radius: 50%;
      border-top-color: #7c9cff;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Game Hub</h1>
    <p class="subtitle">Your complete game collection awaits</p>
    <button id="launchBtn" onclick="launchHub()">Launch Hub</button>
    <div class="loading" id="loadingMsg">
      <span class="spinner"></span>Loading your hub...
    </div>
  </div>

  <script>
    function launchHub() {
      const btn = document.getElementById('launchBtn');
      const loading = document.getElementById('loadingMsg');

      btn.disabled = true;
      loading.style.display = 'block';

      // Fetch hub.html from THIS repository (gamesite667/launch)
      const hubUrl = 'https://raw.githubusercontent.com/gamesite667/launch/main/hub.html';

      fetch(hubUrl)
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
          return r.text();
        })
        .then(html => {
          const w = window.open('about:blank');
          if (!w) {
            alert('Popup blocked. Please allow popups.');
            btn.disabled = false;
            loading.style.display = 'none';
            return;
          }

          w.document.write(html);
          w.document.close();

          btn.disabled = false;
          loading.style.display = 'none';
        })
        .catch(err => {
          console.error('Error:', err);
          alert(`Failed to load hub:\n${err.message}\n\nMake sure hub.html exists at: ${hubUrl}`);
          btn.disabled = false;
          loading.style.display = 'none';
        });
    }
  </script>
</body>
</html>
