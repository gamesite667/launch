<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lockin's Game Site</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --bg-alt: #ebf0f7;
      --surface: #ffffff;
      --surface-2: #edf2fb;
      --text: #111827;
      --muted: #4b5563;
      --accent: #3b82f6;
      --accent-2: #10b981;
      --border: rgba(17, 24, 39, 0.12);
      --button-text: #ffffff;
      --shadow: 0 20px 48px rgba(15, 23, 42, 0.12);
      --chip-bg: rgba(59, 130, 246, 0.1);
      --chip-text: #1f2937;
      --warning: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --nav-bg: rgba(255,255,255,0.72);
    }

    body[data-theme="dark"] {
      --bg: #0b1020;
      --bg-alt: #141d31;
      --surface: rgba(17,24,39,0.9);
      --surface-2: rgba(19,30,52,0.85);
      --text: #e5eefb;
      --muted: #a5b4d3;
      --accent: #7c9cff;
      --accent-2: #36d399;
      --border: rgba(148,163,184,0.18);
      --button-text: #08111d;
      --shadow: 0 24px 64px rgba(2, 6, 23, 0.52);
      --chip-bg: rgba(124,156,255,0.16);
      --chip-text: #e5eefb;
      --nav-bg: rgba(11,16,32,0.7);
    }

    body[data-theme="cyber"] {
      --bg: #070b17;
      --bg-alt: #0d1226;
      --surface: #101935;
      --surface-2: #0d1631;
      --text: #7ef7c7;
      --muted: #9eeed1;
      --accent: #00ff88;
      --accent-2: #00d0ff;
      --border: rgba(0,255,136,0.3);
      --button-text: #03110d;
      --shadow: 0 0 28px rgba(0,255,136,0.28);
      --chip-bg: rgba(0,255,136,0.12);
      --chip-text: #7ef7c7;
      --nav-bg: rgba(12,18,35,0.8);
    }

    body[data-theme="retro"] {
      --bg: #ff00ff;
      --bg-alt: #ff7b00;
      --surface: #ffff00;
      --surface-2: #ffdb00;
      --text: #080808;
      --muted: #1f1f1f;
      --accent: #00ffff;
      --accent-2: #ff4d4d;
      --border: rgba(0,0,0,0.6);
      --button-text: #000000;
      --shadow: 6px 6px 0 rgba(0,0,0,0.4);
      --chip-bg: rgba(0,255,255,0.2);
      --chip-text: #000000;
      --nav-bg: rgba(255,255,0,0.75);
    }

    body[data-theme="sunset"] {
      --bg: #ff7a59;
      --bg-alt: #ffb067;
      --surface: #ffd166;
      --surface-2: #ffe8a3;
      --text: #2d1b12;
      --muted: #563b30;
      --accent: #f72585;
      --accent-2: #ffb703;
      --border: rgba(93,47,26,0.28);
      --button-text: #fff7f2;
      --shadow: 0 20px 48px rgba(111, 49, 22, 0.18);
      --chip-bg: rgba(247,37,133,0.1);
      --chip-text: #2d1b12;
      --nav-bg: rgba(255,209,102,0.7);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-alt), var(--bg));
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 78px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.02em;
      font-size: 1.35rem;
    }

    .theme-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .theme-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      font-weight: 700;
    }

    .theme-btn:hover { transform: translateY(-1px); }
    .theme-btn.active {
      background: var(--accent);
      color: var(--button-text);
      border-color: transparent;
    }

    .app-shell {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 80px;
    }

    .header-card {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      padding: 12px 0 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.02rem;
      margin: 12px 0 0;
      max-width: 780px;
    }

    .wotg-banner {
      margin: 18px 0 24px;
      background: linear-gradient(135deg, rgba(124,156,255,0.18), rgba(52,211,153,0.1));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .wotg-title {
      margin: 0 0 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.9;
      font-size: 0.8rem;
    }

    .wotg-button {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--button-text);
      border-radius: 22px;
      padding: 18px 18px;
      text-align: left;
      cursor: pointer;
      display: flex;
      gap: 18px;
      align-items: center;
      box-shadow: 0 12px 28px rgba(59,130,246,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .wotg-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(59,130,246,0.4);
      filter: brightness(1.04);
    }

    .wotg-button img {
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 18px;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.08);
    }

    .wotg-meta {
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .wotg-name {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2.2rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .wotg-text {
      margin: 10px 0 0;
      opacity: 0.92;
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .wotg-bottom {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .wotg-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .wotg-countdown {
      opacity: 0.8;
      font-size: 0.82rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      padding: 12px 0 22px;
    }

    .search-wrap {
      flex: 1 1 360px;
      position: relative;
      min-width: 220px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 18px 12px 42px;
      color: var(--text);
      outline: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.03);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.8;
    }

    .primary-btn {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--button-text);
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 26px rgba(59,130,246,0.25);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .genre-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .genre-pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .genre-pill.active,
    .genre-pill:hover {
      background: var(--accent);
      color: var(--button-text);
      border-color: transparent;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: rgba(124,156,255,0.5);
    }

    .thumb-wrap {
      position: relative;
      overflow: hidden;
      background: var(--surface-2);
    }

    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 1.35 / 1;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .thumb.loaded { opacity: 1; }

    .thumb-badge {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-weight: 800;
      font-size: 0.75rem;
    }

    .game-body {
      padding: 16px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      background: var(--chip-bg);
      color: var(--chip-text);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.72rem;
      font-weight: 800;
      border: 1px solid var(--border);
    }

    .game-title {
      margin: 14px 0 8px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .game-description {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      min-height: 42px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .play-btn,
    .tips-btn,
    .small-btn {
      flex: 1;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 800;
      border: 1px solid var(--border);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .play-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--button-text);
      border: none;
    }

    .tips-btn,
    .small-btn {
      background: transparent;
      color: var(--text);
    }

    .play-btn:hover,
    .tips-btn:hover,
    .small-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 200;
      background: rgba(0,0,0,0.5);
      padding: 20px;
    }

    .modal.open { display: grid; }

    .modal-content {
      width: min(720px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px;
      max-height: 82vh;
      overflow: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.6rem;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .tips-list {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .tips-list li {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-2);
      line-height: 1.6;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 56px 0 0;
      color: var(--muted);
    }

    .empty-state.visible { display: block; }

    .suggestion-form .form-group {
      margin-bottom: 16px;
    }

    .suggestion-form label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .suggestion-form input,
    .suggestion-form textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      resize: vertical;
    }

    .credit {
      text-align: center;
      padding-top: 38px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 760px) {
      .wotg-button {
        flex-direction: column;
        align-items: flex-start;
      }

      .wotg-button img {
        width: 100%;
        max-width: 100%;
        height: 180px;
      }

      .topbar-inner {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 0;
      }
    }
  </style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">🎮 Lockin's Game Site</div>
      <div class="theme-selector">
        <button class="theme-btn" data-theme="light">☀️ Light</button>
        <button class="theme-btn active" data-theme="dark">🌙 Dark</button>
        <button class="theme-btn" data-theme="cyber">⚡ Cyber</button>
        <button class="theme-btn" data-theme="retro">🕹️ Retro</button>
        <button class="theme-btn" data-theme="sunset">🌅 Sunset</button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <div class="header-card">
      <div>
        <h1>Play Amazing Games</h1>
        <p class="subtitle">Browse your collection, add your own games, discover the weekly pick, and launch everything in a clean blank tab.</p>
      </div>
    </div>

    <section id="wotgBanner" class="wotg-banner">
      <p class="wotg-title">Game of the Week</p>
      <button type="button" id="wotgButton" class="wotg-button" aria-label="Play the game of the week">
        <img id="wotgImage" alt="Game of the week" />
        <div class="wotg-meta">
          <h3 id="wotgName" class="wotg-name">Loading...</h3>
          <p id="wotgText" class="wotg-text">Loading description...</p>
          <div class="wotg-bottom">
            <span class="wotg-label">▶ Play now</span>
            <span id="wotgCountdown" class="wotg-countdown">Rotating weekly...</span>
          </div>
        </div>
      </button>
    </section>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔎</span>
        <input id="searchInput" type="search" placeholder="Search title or genre" aria-label="Search games" />
      </div>
      <button class="primary-btn" type="button" onclick="openSuggestionModal()">+ Suggest a Game</button>
    </div>

    <div id="genreFilters" class="genre-row" aria-label="Genre filters"></div>

    <div id="gamesGrid" class="games-grid" aria-live="polite"></div>
    <div id="emptyState" class="empty-state">No games match your filters.</div>

    <div class="credit">Made by Lockin</div>
  </div>

  <div id="tipsModal" class="modal" aria-modal="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="tipsTitle">Game Tips</h2>
        <button class="close-btn" type="button" onclick="closeTipsModal()">✕</button>
      </div>
      <div id="tipsBody"></div>
    </div>
  </div>

  <div id="suggestionModal" class="modal" aria-modal="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Suggest a Game</h2>
        <button class="close-btn" type="button" onclick="closeSuggestionModal()">✕</button>
      </div>
      <form class="suggestion-form" onsubmit="submitSuggestion(event)">
        <div class="form-group">
          <label for="suggestionName">Game name</label>
          <input id="suggestionName" name="suggestionName" type="text" placeholder="e.g. Neon Drift" required>
        </div>
        <div class="form-group">
          <label for="suggestionUrl">Game URL</label>
          <input id="suggestionUrl" name="suggestionUrl" type="url" placeholder="https://example.com/game.html" required>
        </div>
        <div class="form-group">
          <label for="suggestionReason">Why it should be added</label>
          <textarea id="suggestionReason" name="suggestionReason" rows="4" placeholder="Tell me why this game belongs on the site."></textarea>
        </div>
        <button class="primary-btn" type="submit" style="width:100%;">Send suggestion</button>
      </form>
    </div>
  </div>

      'stickfighter': 'Images/StickFighter.jpg',
      'stickmanhook': 'Images/StickmanHook.jpg',
      'subwaysurfers': 'Images/SubwaySurfers.jpg',
      'tag': 'Images/Tag.jpg',
      'taproad': 'Images/TapRoad.jpg',
      'templerun2': 'Images/TempleRun.jpg',
      'timeshooter2': 'Images/TimeShooter.jpg',
      'timeshooter3': 'Images/TimeShooter3.jpg',
      'tinyfishing': 'Images/TinyFishing.jpg',
      'tombofthemask': 'Images/TombOfTheMask.jpg',
      'tunnelrush': 'Images/TunnelRush.jpg',
      'wordleunlimited': 'Images/Wordle.jpg',
      'zombierush': 'Images/ZombieRush.jpg'
    };

    const TIP_LIBRARY = {
      'Run 3': ['Look ahead before each jump so you can spot the safest path.', 'Stay calm when the tunnel gets tight—patience beats panic.', 'Use short, clean movement bursts instead of forcing a risky run.'],
      'Backrooms': ['Keep moving and watch for sudden shifts in the layout.', 'Don’t rely on one route; explore alternate paths and corners.', 'Listen for audio cues and slow down when the environment changes.'],
      'Drift Boss': ['Try to chain drifts instead of overcorrecting early.', 'Use wide turns to build speed before your big drift.', 'Watch the angle of your car before entering the turn.'],
      'OvO': ['Look for landing spots before you jump so you don’t get caught mid-air.', 'Learn the rhythm of each section instead of rushing.', 'Take short pauses between tough sections to reset your timing.'],
      'Slope': ['Keep your movements smooth and steady instead of frantic.', 'Use the wall edges to your advantage when the track narrows.', 'Practice early waves to learn the rhythm before pushing speed.'],
      'Retro Bowl': ['Manage your play selection carefully instead of forcing risky options.', 'Focus on consistent field position and time management.', 'Build a balanced team rather than chasing one flashy move.'],
      'Tiny Fishing': ['Upgrade gear early so your catches become more valuable.', 'Patience matters; bigger rewards usually arrive with better gear.', 'Spend wisely and keep your rod progression consistent.'],
      'Default': ['Take a moment to learn the controls before you rush the objective.', 'Look for a pattern in each level or round before trying to speed through.', 'Don’t be afraid to restart a challenge when your approach is failing.']
    };

    function repoBaseUrl() {
      if (window.location.hostname.endsWith('github.io')) return GH_PAGES_GAMES_BASE;
      return RAW_GAMES_BASE;
    }

    function makeFallbackImage(title = 'Game') {
      const label = encodeURIComponent(title.slice(0, 18));
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0%" stop-color="#7c9cff"/><stop offset="100%" stop-color="#36d399"/></linearGradient></defs><rect width="600" height="430" fill="#0d1324"/><rect x="30" y="30" width="540" height="370" rx="28" fill="url(#g)" opacity="0.18"/><text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" fill="#edf7ff" font-family="Arial, sans-serif" font-size="42" font-weight="700">${label}</text></svg>`)}`;
    }

    function normalizeKey(value) {
      return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function titleFromFileName(fileName) {
      const raw = fileName.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
      const mapped = {
        'run3': 'Run 3', 'backrooms': 'Backrooms', 'driftboss': 'Drift Boss', 'ovo': 'OvO', 'slope': 'Slope',
        'retrobowl': 'Retro Bowl', 'retrobowlcollege': 'Retro Bowl College', 'tinyfishing': 'Tiny Fishing',
        '1.8': 'Minecraft 1.8', 'paperio2': 'Paper.io 2', 'fnaf': "Five Nights at Freddy's", 'fnaf2': 'FNAF 2',
        'fnaf3': 'FNAF 3', 'fnaf4': 'FNAF 4', 'dreadheadparkour': 'Dreadhead Parkour', 'crazymotorcycle': 'Crazy Motorcycle',
        'funnyshooter2': 'Funny Shooter 2', 'geometrydashlite': 'Geometry Dash Lite', 'tombofthemask': 'Tomb of the Mask',
        'timeshooter2': 'Time Shooter 2', 'timeshooter3': 'Time Shooter 3', 'templerun2': 'Temple Run 2', 'wordleunlimited': 'Wordle Unlimited',
        'snowballio': 'Snowball.io', 'stacktris': 'Stacktris', 'monkeymart': 'Monkey Mart', 'mario64': 'Mario 64', 'motox3m': 'Moto X3M',
        'blumgiracers': 'Blumgi Racers', 'guesstheiranswer': 'Guess Their Answer', 'houseofhazards': 'House of Hazards',
        'hoverracerdrive': 'Hover Racer Drive', 'johnnytrigger': 'Johnny Trigger', 'leveldevil': 'Level Devil', 'noobminer': 'Noob Miner',
        'balatro': 'Balatro', 'basketballstars': 'Basketball Stars', 'basketrandom': 'Basket Random', 'blockysnakes': 'Blocky Snakes',
        'capybaraclicker': 'Capybara Clicker', 'carkingarena': 'Car King Arena', 'cleanupio': 'Cleanup.io', 'clusterrush': 'Cluster Rush',
        'cookieclicker': 'Cookie Clicker', 'crazycars': 'Crazy Cars', 'crossyroad': 'Crossy Road', 'dadish1': 'Dadish 1',
        'dadish2': 'Dadish 2', 'doodlejump': 'Doodle Jump', 'drivemad': 'Drive Mad', 'eggycar': 'Eggy Car', 'elasticface': 'Elastic Face',
        'evilglitch': 'Evil Glitch', 'flappybird': 'Flappy Bird', 'fluidsimulator': 'Fluid Simulator', 'footballlegends': 'Football Legends',
        'fruitninja': 'Fruit Ninja', 'funnybattle': 'Funny Battle', 'geometryvibes': 'Geometry Vibes', 'granny': 'Granny',
        'helixjump': 'Helix Jump', 'polytrack': 'Polytrack', 'ragdollarchers': 'Ragdoll Archers', 'spacebarclicker': 'Spacebar Clicker',
        'stack': 'Stack', 'stickfighter': 'Stick Fighter', 'stickmanhook': 'Stickman Hook', 'subwaysurfers': 'Subway Surfers',
        'tag': 'Tag', 'taproad': 'Tap Road', 'tunnelrush': 'Tunnel Rush', 'zombierush': 'Zombie Rush', 'pianotiles': 'Piano Tiles'
      };

      const key = normalizeKey(raw);
      return mapped[key] || raw.replace(/\b\w/g, c => c.toUpperCase());
    }

    function inferGenre(fileName, title) {
      const combo = `${fileName} ${title}`.toLowerCase();
      const rules = [
        ['Racing', ['race', 'racer', 'drift', 'car', 'motor', 'track', 'road', 'drive', 'mad', 'speed', 'tunnel']],
        ['Sports', ['bowl', 'basket', 'football', 'soccer', 'sports', 'ball', 'stick', 'golf', 'tennis']],
        ['Horror', ['backrooms', 'fnaf', 'granny', 'horror', 'scary', 'nightmare']],
        ['Platformer', ['run', 'jump', 'ovo', 'platform', 'parkour', 'stickman', 'hook', 'mario', 'doodle', 'level']],
        ['Puzzle', ['2048', 'guess', 'wordle', 'puzzle', 'logic', 'match', 'brain', 'stack', 'miner', 'climb', 'elastic']],
        ['Action', ['battle', 'shooter', 'fight', 'trigger', 'shoot', 'combat', 'attack', 'survival', 'pvp']],
        ['Adventure', ['backrooms', 'escape', 'adventure', 'explore', 'dungeon', 'house']],
        ['Idle', ['clicker', 'idle', 'mart', 'farm', 'miner', 'fishing', 'tap']],
        ['Multiplayer', ['multiplayer', 'io', 'arena', 'battle', 'online', 'stars', 'team', 'co-op']],
        ['Simulation', ['simulator', 'sim', 'fluid', 'physics', 'builder', 'car', 'driving']],
        ['Clicker', ['clicker', 'tap']],
        ['Shooter', ['shoot', 'gun', 'trigger', 'shooter']],
        ['Strategy', ['strategy', 'deck', 'build', 'management', 'roguelike', 'balatro']],
        ['Arcade', ['arcade', 'endless', 'rush', 'dash', 'flappy', 'snake', 'maze', 'runner']]
      ];

      for (const [genre, words] of rules) {
        if (words.some(word => combo.includes(word))) return genre;
      }
      return 'Arcade';
    }

    function getDescription(title) {
      if (title === 'Run 3') return 'Run through an endless tunnel and stay alive as the path changes.';
      if (title === 'Backrooms') return 'Explore a surreal maze and look for a way out before the panic sets in.';
      if (title === 'Drift Boss') return 'Master the art of drift control and chase bigger score chains.';
      if (title === 'OvO') return 'Jump, dodge, and clear precise platform sections with smooth movement.';
      if (title === 'Slope') return 'Race down a bright neon hill and survive the sharp turns.';
      if (title === 'Retro Bowl') return 'Build your football legacy with smart choices and better field position.';
      if (title === 'Tiny Fishing') return 'Relax, upgrade your gear, and reel in bigger wins over time.';
      return 'A fun browser game ready to play.';
    }

    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      state.theme = theme;
      localStorage.setItem('theme', theme);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }

    function renderGenreFilters() {
      const filterWrap = document.getElementById('genreFilters');
      filterWrap.innerHTML = '';
      GENRE_OPTIONS.forEach(genre => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'genre-pill' + (genre === state.activeGenre ? ' active' : '');
        btn.textContent = genre;
        btn.addEventListener('click', () => {
          state.activeGenre = genre;
          renderGenreFilters();
          renderGames();
        });
        filterWrap.appendChild(btn);
      });
    }

    function getAllGames() {
      return [...state.games, ...state.customGames];
    }

    function getGameOfWeek() {
      const all = getAllGames();
      if (!all.length) return null;
      const epoch = new Date('2024-01-01T00:00:00Z').getTime();
      const week = 7 * 24 * 60 * 60 * 1000;
      const index = Math.floor((Date.now() - epoch) / week) % all.length;
      return all[index];
    }

    function updateGameOfWeek() {
      const game = getGameOfWeek();
      const wotgButton = document.getElementById('wotgButton');
      const wotgImage = document.getElementById('wotgImage');
      const wotgName = document.getElementById('wotgName');
      const wotgText = document.getElementById('wotgText');
      const wotgCountdown = document.getElementById('wotgCountdown');

      if (!game) {
        wotgButton.style.display = 'none';
        return;
      }

      wotgButton.style.display = 'flex';
      wotgButton.onclick = () => launchGame(game.url, game.title);
      wotgImage.src = game.thumbnail || makeFallbackImage(game.title);
      wotgImage.alt = game.title;
      wotgName.textContent = game.title;
      wotgText.textContent = game.description || 'A great game ready to play.';

      const weekMs = 7 * 24 * 60 * 60 * 1000;
      const epoch = new Date('2024-01-01T00:00:00Z').getTime();
      const nextWeekStart = epoch + (Math.floor((Date.now() - epoch) / weekMs) + 1) * weekMs;
      const daysLeft = Math.max(1, Math.ceil((nextWeekStart - Date.now()) / (24 * 60 * 60 * 1000)));
      wotgCountdown.textContent = `Rotates in ${daysLeft} day${daysLeft === 1 ? '' : 's'}`;
    }

    function renderGames() {
      const all = getAllGames();
      const filtered = all.filter(game => {
        const matchQuery = !state.query || `${game.title} ${game.genre}`.toLowerCase().includes(state.query.toLowerCase());
        const matchGenre = state.activeGenre === 'All' || game.genre === state.activeGenre;
        return matchQuery && matchGenre;
      });

      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      filtered.forEach(game => {
        const card = document.createElement('article');
        card.className = 'game-card';
        card.innerHTML = `
          <button type="button" class="thumb-button" style="border:0;background:none;padding:0;width:100%;cursor:pointer;display:block;" data-launch="${game.url}">
            <div class="thumb-wrap">
              <img class="thumb" src="${game.thumbnail || makeFallbackImage(game.title)}" alt="${game.title}" loading="lazy" onload="this.classList.add('loaded')" />
              <span class="thumb-badge">▶</span>
            </div>
          </button>
          <div class="game-body">
            <span class="chip">${game.genre || 'Custom'}</span>
            <h3 class="game-title">${game.title}</h3>
            <p class="game-description">${game.description || 'A fun game ready to play.'}</p>
            <div class="card-actions">
              <button type="button" class="play-btn" data-launch="${game.url}">Play</button>
              <button type="button" class="tips-btn" data-tip-title="${escapeHtml(game.title)}">Tips</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll('[data-launch]').forEach(el => {
        el.addEventListener('click', () => {
          const url = el.getAttribute('data-launch');
          const title = el.closest('.game-card')?.querySelector('.game-title')?.textContent || 'Game';
          launchGame(url, title);
        });
      });

      document.querySelectorAll('[data-tip-title]').forEach(btn => {
        btn.addEventListener('click', () => {
          const title = btn.getAttribute('data-tip-title');
          showTips(title);
        });
      });

      document.getElementById('emptyState').classList.toggle('visible', filtered.length === 0);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getTipsForGame(title) {
      const found = TIP_LIBRARY[title] || TIP_LIBRARY.Default;
      return found.map((tip, idx) => `<li><strong>Tip ${idx + 1}:</strong> ${tip}</li>`).join('');
    }

    function showTips(title) {
      const tipsTitle = document.getElementById('tipsTitle');
      const tipsBody = document.getElementById('tipsBody');
      tipsTitle.textContent = `${title} tips`;
      const tips = getTipsForGame(title);
      tipsBody.innerHTML = `
        <p style="color: var(--muted); margin:0 0 12px;">Here are a few ways to improve and get unstuck:</p>
        <ul class="tips-list">${tips}</ul>
        <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="primary-btn" type="button" onclick="launchGameFromTitle('${escapeHtml(title)}')">Play now</button>
          <button class="small-btn" type="button" onclick="closeTipsModal()">Close</button>
        </div>
      `;
      document.getElementById('tipsModal').classList.add('open');
    }

    function launchGameFromTitle(title) {
      const game = getAllGames().find(g => g.title === title);
      if (game) launchGame(game.url, game.title);
    }

    function closeTipsModal() {
      document.getElementById('tipsModal').classList.remove('open');
    }

    function openSuggestionModal() {
      document.getElementById('suggestionModal').classList.add('open');
    }

    function closeSuggestionModal() {
      document.getElementById('suggestionModal').classList.remove('open');
      document.getElementById('suggestionName').value = '';
      document.getElementById('suggestionUrl').value = '';
      document.getElementById('suggestionReason').value = '';
    }

    function submitSuggestion(event) {
      event.preventDefault();
      const title = document.getElementById('suggestionName').value.trim();
      const url = document.getElementById('suggestionUrl').value.trim();
      const reason = document.getElementById('suggestionReason').value.trim();

      if (!title || !url) return;

      const issueTitle = encodeURIComponent(`Game suggestion: ${title}`);
      const issueBody = encodeURIComponent(
        `Game name: ${title}\n\n` +
        `URL: ${url}\n\n` +
        `Why it should be added:\n${reason || 'No description provided.'}\n\n` +
        `Suggested by: Lockin's Game Site`
      );

      window.open(`${ISSUE_URL}?title=${issueTitle}&body=${issueBody}`, '_blank');
      closeSuggestionModal();
    }

    function launchGame(url, title) {
      fetch(url)
        .then(r => {
          if (!r.ok) throw new Error('Game failed to load.');
          return r.text();
        })
        .then(html => {
          const popup = window.open('about:blank');
          if (!popup) {
            alert('Popup blocked. Please allow popups and try again.');
            return;
          }

          const doc = popup.document;
          doc.open();
          doc.write(html);
          doc.close();
        })
        .catch(error => {
          console.error(error);
          alert(`Couldn't launch ${title}. Please check the URL and try again.`);
        });
    }

    async function loadGames() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GAMES_OWNER}/${GAMES_REPO}/git/trees/main?recursive=1`);
        if (!res.ok) throw new Error('GitHub API failed');
        const data = await res.json();
        const tree = Array.isArray(data.tree) ? data.tree : [];

        const games = tree
          .filter(entry => entry.type === 'blob' && /\.(html?|htm)$/i.test(entry.path) && !entry.path.startsWith('Images/'))
          .map(entry => {
            const fileName = entry.path.split('/').pop();
            const stem = fileName.replace(/\.[^.]+$/, '').toLowerCase();
            const title = titleFromFileName(fileName);
            const genre = inferGenre(fileName, title);
            const imagePath = GAME_IMAGE_MAP[stem] || GAME_IMAGE_MAP[normalizeKey(stem)] || null;
            const thumbnail = imagePath ? new URL(imagePath, repoBaseUrl()).toString() : makeFallbackImage(title);
            return {
              title,
              url: new URL(fileName, repoBaseUrl()).toString(),
              genre,
              description: getDescription(title),
              thumbnail,
              custom: false
            };
          })
          .sort((a,b) => a.title.localeCompare(b.title));

        state.games = games;
        renderGenreFilters();
        renderGames();
        updateGameOfWeek();
      } catch (error) {
        console.error(error);
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.query = e.target.value.trim();
      renderGames();
    });

    document.querySelectorAll('.theme-btn').forEach(btn => setTheme(state.theme));
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    setTheme(state.theme);
    loadGames();
  </script>
</body>
</html>
