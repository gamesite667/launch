<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Vault Pro</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-alt: #141d31;
      --surface: rgba(17,24,39,0.9);
      --surface-2: rgba(19,30,52,0.85);
      --text: #e5eefb;
      --muted: #a5b4d3;
      --accent: #7c9cff;
      --accent-2: #36d399;
      --border: rgba(148,163,184,0.18);
      --button-text: #08111d;
      --shadow: 0 24px 64px rgba(2, 6, 23, 0.52);
      --chip-bg: rgba(124,156,255,0.16);
      --chip-text: #e5eefb;
      --highlight: #e94560;
    }

    body[data-theme="light"] {
      --bg: #f4f7fb;
      --bg-alt: #ebf0f7;
      --surface: #ffffff;
      --surface-2: #edf2fb;
      --text: #111827;
      --muted: #4b5563;
      --accent: #3b82f6;
      --accent-2: #10b981;
      --border: rgba(17, 24, 39, 0.12);
      --button-text: #ffffff;
      --chip-bg: rgba(59, 130, 246, 0.1);
      --chip-text: #1f2937;
      --highlight: #ff6b6b;
    }

    body[data-theme="retro"] {
      --bg: #ff00ff;
      --bg-alt: #ff7b00;
      --surface: #ffff00;
      --surface-2: #ffdb00;
      --text: #000000;
      --muted: #1f1f1f;
      --accent: #00ffff;
      --accent-2: #ff4d4d;
      --border: rgba(0,0,0,0.6);
      --button-text: #000000;
      --chip-bg: rgba(0,255,255,0.2);
      --chip-text: #000000;
      --highlight: #ff00ff;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-alt), var(--bg));
      color: var(--text);
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      overflow-y: auto;
      grid-row: 1;
      grid-column: 1;
    }

    .sidebar-section {
      padding: 0 16px 20px;
    }

    .sidebar-title {
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 16px 0 12px;
      padding: 0 12px;
    }

    .sidebar-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .sidebar-btn:hover,
    .sidebar-btn.active {
      background: var(--accent);
      color: var(--button-text);
      border-color: transparent;
    }

    .main-content {
      grid-row: 1;
      grid-column: 2;
      padding: 24px;
      overflow-y: auto;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.02em;
      font-size: 1.35rem;
      padding: 0 16px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 3.5vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin: 0 0 24px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px 10px 36px;
      color: var(--text);
      outline: none;
      font-size: 0.9rem;
      transition: border-color 0.2s ease;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.7;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(124,156,255,0.5);
    }

    .thumb-wrap {
      position: relative;
      overflow: hidden;
      background: var(--surface-2);
    }

    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 1.35 / 1;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .thumb.loaded { opacity: 1; }

    .thumb-badge {
      position: absolute;
      right: 8px;
      bottom: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-weight: 800;
      font-size: 0.65rem;
    }

    .game-body {
      padding: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      background: var(--chip-bg);
      color: var(--chip-text);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.65rem;
      font-weight: 800;
      border: 1px solid var(--border);
    }

    .game-title {
      margin: 8px 0 4px;
      font-size: 0.95rem;
      font-weight: 800;
      word-break: break-word;
    }

    .game-description {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.3;
      font-size: 0.75rem;
      min-height: 30px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .play-btn, .tips-btn {
      flex: 1;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .play-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--button-text);
      border: none;
    }

    .tips-btn {
      background: transparent;
      color: var(--text);
    }

    .play-btn:hover, .tips-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 200;
      background: rgba(0,0,0,0.6);
      padding: 20px;
    }

    .modal.open { display: grid; }

    .modal-content {
      width: min(680px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
      max-height: 80vh;
      overflow: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.4rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .tips-list {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: grid;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }

    .tips-list li {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      line-height: 1.4;
      font-size: 0.85rem;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
    }

    .empty-state.visible { display: block; }

    @media (max-width: 1024px) {
      body { grid-template-columns: 1fr; }
      .sidebar { grid-column: 1; grid-row: 1; max-height: 140px; overflow-x: auto; display: flex; flex-direction: row; padding: 12px; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar-section { display: flex; gap: 12px; padding: 0; margin: 0; white-space: nowrap; }
      .sidebar-title { display: none; }
      .sidebar-btn { margin-bottom: 0; flex-shrink: 0; }
      .main-content { grid-column: 1; grid-row: 2; }
      body { grid-template-rows: 140px 1fr; }
    }
  </style>
</head>
<body data-theme="dark">
  <aside class="sidebar">
    <div class="brand">🎮 Gamesite667</div>

    <div class="sidebar-section">
      <p class="sidebar-title">Theme</p>
      <button class="sidebar-btn active" data-theme="dark">🌙 Dark</button>
      <button class="sidebar-btn" data-theme="light">☀️ Light</button>
      <button class="sidebar-btn" data-theme="retro">🕹️ Retro</button>
    </div>
  </aside>

  <main class="main-content">
    <h1>Play Amazing Games</h1>
    <p class="subtitle">Your personal collection of browser games. Click Play to launch each game in a new tab.</p>

    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input id="searchInput" type="search" placeholder="Search games..." />
    </div>

    <div id="gamesGrid" class="games-grid"></div>
    <div id="emptyState" class="empty-state">No games found.</div>
  </main>

  <div id="tipsModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="tipsTitle">Tips</h2>
        <button class="close-btn" type="button" onclick="closeTipsModal()">✕</button>
      </div>
      <div id="tipsBody"></div>
    </div>
  </div>

      'Flappy Bird': ['Time your taps perfectly', 'Control descent speed carefully', 'Aim for center gaps', 'Stay calm under pressure', 'Master tap timing precision', 'Perfect your control sensitivity', 'Learn gap patterns', 'Master spacing distances', 'Control altitude precisely', 'Keep steady focus', 'Avoid obstacles cleanly', 'Stay concentrated', 'Practice consistency', 'Build muscle memory', 'Learn patterns quickly', 'Master reflexes', 'Perfect reactions', 'Stay alert always', 'Watch ahead carefully', 'Predict obstacle position', 'Learn level rhythm', 'Master the beat', 'Build timing skills', 'Stay composed', 'Manage pressure', 'Build confidence', 'Practice daily routine', 'Keep trying always', 'Learn from mistakes', 'Master persistence', 'Build resilience', 'Stay determined', 'Overcome frustration', 'Master calmness', 'Perfect focus', 'Build concentration', 'Learn to relax', 'Master tension control', 'Stay loose always', 'Keep proper grip', 'Master proper control', 'Perfect sensitivity', 'Learn device feel', 'Master screen feel', 'Build accuracy', 'Improve precision', 'Perfect your aim', 'Stay steady always', 'Build smoothness', 'Master flow state', 'Learn your style']
    };

    const state = {
      games: [],
      searchQuery: '',
      theme: localStorage.getItem('theme') || 'dark'
    };

    // Hardcoded games that point to THIS repository
    const GAMES = [
      {
        title: 'Run 3',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/run3.html',
        genre: 'Platformer',
        description: 'A challenging parkour platformer with gravity-defying mechanics.'
      },
      {
        title: 'Backrooms',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/backrooms.html',
        genre: 'Horror',
        description: 'Escape the mysterious infinite hallways of the backrooms.'
      },
      {
        title: 'Drift Boss',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/driftboss.html',
        genre: 'Racing',
        description: 'Master the art of drifting on winding mountain roads.'
      },
      {
        title: 'OvO',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/ovo.html',
        genre: 'Platformer',
        description: 'A minimal platformer with challenging gravity mechanics.'
      },
      {
        title: 'Slope',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/slope.html',
        genre: 'Arcade',
        description: 'Roll down an endless slope and avoid obstacles.'
      },
      {
        title: 'Retro Bowl',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/retrobowl.html',
        genre: 'Sports',
        description: 'Lead your team to victory in this retro football game.'
      },
      {
        title: 'Tiny Fishing',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/tinyfishing.html',
        genre: 'Idle',
        description: 'A relaxing fishing game with incremental gameplay.'
      },
      {
        title: 'Flappy Bird',
        url: 'https://raw.githubusercontent.com/gamesite667/launch/main/games/flappybird.html',
        genre: 'Arcade',
        description: 'The classic tap-to-fly game that challenged millions.'
      }
    ];

    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      state.theme = theme;
      localStorage.setItem('theme', theme);
      document.querySelectorAll('[data-theme]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }

    function renderGames() {
      const filtered = GAMES.filter(g => {
        return !state.searchQuery || `${g.title} ${g.genre}`.toLowerCase().includes(state.searchQuery.toLowerCase());
      });

      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      filtered.forEach(game => {
        const card = document.createElement('article');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="thumb-wrap">
            <div style="width:100%; height:150px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-size: 3rem;">🎮</div>
            <span class="thumb-badge">▶</span>
          </div>
          <div class="game-body">
            <span class="chip">${game.genre}</span>
            <h3 class="game-title">${game.title}</h3>
            <p class="game-description">${game.description}</p>
            <div class="card-actions">
              <button type="button" class="play-btn" onclick="launchGame('${game.url.replace(/'/g, "\\'")}', '${game.title.replace(/'/g, "\\'")}')">Play</button>
              <button type="button" class="tips-btn" onclick="showTips('${game.title.replace(/'/g, "\\'")}')">Tips</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('emptyState').classList.toggle('visible', filtered.length === 0);
    }

    function showTips(title) {
      const tips = GAME_TIPS[title] || ['Tips coming soon for this game!'];
      document.getElementById('tipsTitle').textContent = `${title} - Tips (${tips.length})`;
      document.getElementById('tipsBody').innerHTML = `<ul class="tips-list">${tips.map((t, i) => `<li><strong>#${i + 1}:</strong> ${t}</li>`).join('')}</ul>`;
      document.getElementById('tipsModal').classList.add('open');
    }

    function closeTipsModal() {
      document.getElementById('tipsModal').classList.remove('open');
    }

    function launchGame(url, title) {
      fetch(url)
        .then(r => r.text())
        .then(html => {
          const w = window.open('about:blank');
          if (!w) {
            alert('Popups blocked. Please allow popups.');
            return;
          }
          const baseHref = url.substring(0, url.lastIndexOf('/') + 1);
          const withBase = html.replace(/<head\s*>/i, `<head><base href="${baseHref}">`);
          w.document.write(withBase);
          w.document.close();
        })
        .catch(() => alert(`Failed to load ${title}`));
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      state.searchQuery = e.target.value;
      renderGames();
    });

    document.querySelectorAll('[data-theme]').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    setTheme(state.theme);
    renderGames();
  </script>
</body>
</html>
